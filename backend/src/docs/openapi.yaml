openapi: 3.0.3
info:
  title: Team Task Tracker API
  description: |
    Production-grade SDE-II REST API for a team-based task tracker.
    Features role-based access control (RBAC), multi-tenancy (organizations), 
    strict state transitions, JWT token rotation, caching, and robust error handling.
  version: 1.0.0
  contact:
    name: SDE-II Candidate
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the application server.
      responses:
        '200':
          description: Server is healthy and operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-05-30T12:00:00.000Z"
                  uptime:
                    type: number
                    example: 324.5

  /auth/register:
    post:
      summary: Register a new administrator
      description: |
        Register a new ADMIN account and initialize a new organization.
        Gated strictly to ADMIN workspace creators. Other staff members must be provisioned via the admin panel dashboard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
                - organizationName
              properties:
                email:
                  type: string
                  format: email
                  example: admin@acme.com
                password:
                  type: string
                  example: securepassword123
                role:
                  type: string
                  enum: [ADMIN]
                  example: ADMIN
                organizationName:
                  type: string
                  description: The name of the organization to initialize
                  example: Acme Corporation
      responses:
        '201':
          description: Administrator and organization registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Administrator registered successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 9d6bfb71-3baa-4192-8821-ee98c18ac766
                      email:
                        type: string
                        example: admin@acme.com
                      role:
                        type: string
                        example: ADMIN
                      organizationId:
                        type: string
                        format: uuid
                        example: e67a13d7-4cd1-45bc-9db0-1282937eb7df
        '400':
          description: Validation error
        '409':
          description: Conflict (e.g. email already exists)

  /auth/login:
    post:
      summary: Authenticate a user
      description: Logs in a user, returns access token and stateful rotation refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@acme.com
                password:
                  type: string
                  example: securepassword123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Authentication successful
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          role:
                            type: string
                          organizationId:
                            type: string
                            format: uuid
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken:
                        type: string
                        example: 8f4db899b8214309a6c429ba22ff7ac222...
        '401':
          description: Invalid email or password credentials

  /auth/refresh:
    post:
      summary: Rotate access sessions
      description: Uses a refresh token to generate a new short-lived access token and a rotated refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 8f4db899b8214309a6c429ba22ff7ac222...
      responses:
        '200':
          description: Access session renewed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Access session renewed successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken:
                        type: string
                        example: 3bb0a4025f18c8942b10df2ab33a2d2105...
        '401':
          description: Invalid, expired, or already-revoked refresh token

  /auth/logout:
    post:
      summary: Terminate user session
      description: Logs out the user by revoking and deleting the provided refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 8f4db899b8214309a6c429ba22ff7ac222...
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Logged out successfully. Session invalidated.

  /users:
    post:
      summary: Provision a new tenant user (ADMIN only)
      description: Creates a user account directly linked to the ADMIN's organization. Restricted to ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: employee@acme.com
                password:
                  type: string
                  example: TempPassword123!
                role:
                  type: string
                  enum: [MANAGER, MEMBER]
                  example: MEMBER
      responses:
        '201':
          description: Tenant user provisioned successfully
        '400':
          description: Validation error or invalid provisioning role
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden (strictly restricted to ADMIN role)
        '409':
          description: Conflict (email already registered)

    get:
      summary: List all users in organization (ADMIN and MANAGER only)
      description: Returns a list of users belonging strictly to the authenticated user's organization.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list fetched successfully
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden (strictly restricted to ADMIN or MANAGER roles)

  /users/{id}:
    patch:
      summary: Partially update tenant user (ADMIN only)
      description: Change the role or isBlocked status of an employee user in the organization. Restricted to ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the user to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [MANAGER, MEMBER]
                  example: MANAGER
                isBlocked:
                  type: boolean
                  example: true
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Validation error or self-mutation attempt
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden
        '404':
          description: User not found in this organization (BOLA guard)

    delete:
      summary: Remove user from organization (ADMIN only)
      description: Deletes and removes an employee user from the organization. Restricted to ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the user to delete
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Self-deletion attempt
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden
        '404':
          description: User not found in this organization (BOLA guard)

  /projects:
    post:
      summary: Create a new project (ADMIN and MANAGER only)
      description: Creates a new project in the organization. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: Alpha Migration Taskboard
                description:
                  type: string
                  example: Project workspace tracking cloud migration tasks.
      responses:
        '201':
          description: Project created successfully
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden

    get:
      summary: List projects (ADMIN, MANAGER, MEMBER)
      description: |
        Returns a list of projects in the organization.
        - **ADMIN/MANAGER**: Returns all projects in their organization.
        - **MEMBER**: Returns only projects where they are registered members.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Projects list fetched successfully
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden

  /projects/{id}:
    get:
      summary: Get project details (ADMIN, MANAGER, MEMBER)
      description: Returns the project details including assigned members. Scoped to membership for members (BOLA guard).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details fetched successfully
        '401':
          description: Missing or expired token
        '404':
          description: Project not found in organization

    patch:
      summary: Update project metadata (ADMIN and MANAGER only)
      description: Updates the project name or description. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Beta Redesign Project
                description:
                  type: string
                  example: Description update.
      responses:
        '200':
          description: Project updated successfully
        '401':
          description: Missing or expired token
        '404':
          description: Project not found

    delete:
      summary: Delete project (ADMIN and MANAGER only)
      description: Deletes the project from the organization. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project deleted successfully
        '401':
          description: Missing or expired token
        '404':
          description: Project not found

  /projects/{id}/members:
    post:
      summary: Assign member to project (ADMIN and MANAGER only)
      description: Assigns a user belonging strictly to the same organization to the project. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
                  example: 9d6bfb71-3baa-4192-8821-ee98c18ac766
      responses:
        '201':
          description: Member assigned successfully
        '400':
          description: Validation error
        '401':
          description: Missing or expired token
        '404':
          description: Project or target User not found inside organization (Cross-tenant block)

  /projects/{id}/members/{userId}:
    delete:
      summary: Remove member from project (ADMIN and MANAGER only)
      description: Removes a user from the project membership list. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed successfully
        '401':
          description: Missing or expired token
        '404':
          description: Project not found

  /tasks:
    post:
      summary: Create a new task (ADMIN and MANAGER only)
      description: Creates a new task within a project. Gated by project membership constraints.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - projectId
              properties:
                title:
                  type: string
                  example: Implement Redis Cache
                description:
                  type: string
                  example: Set up O(1) set-tracking task list caching.
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH]
                  example: HIGH
                projectId:
                  type: string
                  format: uuid
                  example: e67a13d7-4cd1-45bc-9db0-1282937eb7df
                assigneeId:
                  type: string
                  format: uuid
                  example: 9d6bfb71-3baa-4192-8821-ee98c18ac766
                dueDate:
                  type: string
                  format: date-time
                  example: "2026-06-30T12:00:00.000Z"
      responses:
        '201':
          description: Task created successfully
        '400':
          description: Validation error or assignee not registered project member
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden
        '404':
          description: Target project not found

    get:
      summary: List tasks (ADMIN, MANAGER, MEMBER)
      description: |
        Returns a paginated list of tasks matching filters in the organization.
        - **ADMIN/MANAGER**: Can see all tasks within their organization.
        - **MEMBER**: Automatically restricted to seeing only tasks assigned directly to them.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE, BLOCKED]
        - name: priority
          in: query
          schema:
            type: string
            enum: [LOW, MEDIUM, HIGH]
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: projectId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Tasks list fetched successfully
        '401':
          description: Missing or expired token

  /tasks/{id}:
    get:
      summary: Get task details (ADMIN, MANAGER, MEMBER)
      description: Returns task metadata, assignee details, and transition histories. Scoped to assignee for members.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task details fetched successfully
        '401':
          description: Missing or expired token
        '404':
          description: Task not found

    patch:
      summary: Update task metadata (ADMIN and MANAGER only)
      description: Partially updates task title, description, priority, assignee, and due date. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: Refined Task Title
                description:
                  type: string
                  example: Updated description details.
                priority:
                  type: string
                  enum: [LOW, MEDIUM, HIGH]
                assigneeId:
                  type: string
                  format: uuid
                  nullable: true
                dueDate:
                  type: string
                  format: date-time
                  nullable: true
      responses:
        '200':
          description: Task metadata updated successfully
        '400':
          description: Validation error (e.g. past due_date)
        '401':
          description: Missing or expired token
        '404':
          description: Task not found

    delete:
      summary: Delete task (ADMIN and MANAGER only)
      description: Removes the task from the organization workspace. Restricted to ADMIN/MANAGER.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task deleted successfully
        '401':
          description: Missing or expired token
        '404':
          description: Task not found

  /tasks/{id}/status:
    patch:
      summary: Transition task status (Assignee or MANAGER/ADMIN only)
      description: |
        Advances a task status through strict allowed transitions:
        - `TODO -> IN_PROGRESS -> IN_REVIEW -> DRAFT`
        - Any active state -> `BLOCKED`
        - `BLOCKED` -> any active state
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [TODO, IN_PROGRESS, IN_REVIEW, DONE, BLOCKED]
                  example: IN_PROGRESS
      responses:
        '200':
          description: Task status successfully transitioned and audited
        '400':
          description: Invalid transition attempt
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden status update (e.g. member updating unassigned task status)
        '404':
          description: Task not found

  /notifications:
    get:
      summary: List persistent notifications (ADMIN, MANAGER, MEMBER)
      description: Returns a paginated inbox list of the user's unread and read notifications.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Notifications inbox fetched successfully
        '401':
          description: Missing or expired token

  /notifications/stream:
    get:
      summary: Subscribe to real-time notification stream (SSE)
      description: Establishes a persistent Server-Sent Events stream to receive real-time notifications for task status updates.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Real-time stream successfully established
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: Missing or expired token

  /notifications/{id}/read:
    patch:
      summary: Mark single notification as read (ADMIN, MANAGER, MEMBER)
      description: Marks a specific persistent notification inbox record as read. Restricted to owner (BOLA guard).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Notification successfully marked as read
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden notification access (BOLA check failed)
        '404':
          description: Notification not found

  /notifications/read-all:
    post:
      summary: Mark all notifications as read (ADMIN, MANAGER, MEMBER)
      description: Marks all persistent notification inbox records for the user as read.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications successfully marked as read
        '401':
          description: Missing or expired token

  /analytics/tasks:
    get:
      summary: Get task performance analytics (ADMIN and MANAGER only)
      description: |
        Returns organization-wide employee task metrics using raw SQL window aggregations:
        - Overdue task count per user.
        - Average completion time (seconds) per user.
        - Performance ranking (fastest to slowest).
        - Organization-wide average completion baseline.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Analytics data fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Task analytics fetched successfully.
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                          format: uuid
                        email:
                          type: string
                        role:
                          type: string
                        overdueCount:
                          type: integer
                          example: 2
                        avgCompletionSeconds:
                          type: number
                          example: 1845.5
                        performanceRank:
                          type: integer
                          example: 1
                        orgWideAvgCompletionSeconds:
                          type: number
                          example: 2542.1
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden (strictly restricted to ADMIN or MANAGER roles)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
