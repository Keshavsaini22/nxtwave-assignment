openapi: 3.0.3
info:
  title: Team Task Tracker API
  description: |
    Production-grade SDE-II REST API for a team-based task tracker.
    Features role-based access control (RBAC), multi-tenancy (organizations), 
    strict state transitions, JWT token rotation, caching, and robust error handling.
  version: 1.0.0
  contact:
    name: SDE-II Candidate
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the application server.
      responses:
        '200':
          description: Server is healthy and operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                    example: "2026-05-30T12:00:00.000Z"
                  uptime:
                    type: number
                    example: 324.5

  /auth/register:
    post:
      summary: Register a new user
      description: |
        Create a new user account.
        - **ADMIN role**: Requires `organizationName` to create a new organization.
        - **MANAGER/MEMBER roles**: Requires `organizationId` of an existing organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minimum: 8
                  example: securepassword123
                role:
                  type: string
                  enum: [ADMIN, MANAGER, MEMBER]
                  example: MEMBER
                organizationName:
                  type: string
                  description: Required only if role is ADMIN
                  example: Acme Corporation
                organizationId:
                  type: string
                  format: uuid
                  description: Required only if role is MANAGER or MEMBER
                  example: e67a13d7-4cd1-45bc-9db0-1282937eb7df
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        example: 9d6bfb71-3baa-4192-8821-ee98c18ac766
                      email:
                        type: string
                        example: user@example.com
                      role:
                        type: string
                        example: MEMBER
                      organizationId:
                        type: string
                        format: uuid
                        example: e67a13d7-4cd1-45bc-9db0-1282937eb7df
        '400':
          description: Validation error (e.g. missing organizationId for MEMBER)
        '409':
          description: Conflict (e.g. email already exists)

  /auth/login:
    post:
      summary: Authenticate a user
      description: Logs in a user, returns access token and stateful rotation refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@acme.com
                password:
                  type: string
                  example: securepassword123
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Authentication successful
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          email:
                            type: string
                          role:
                            type: string
                          organizationId:
                            type: string
                            format: uuid
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken:
                        type: string
                        example: 8f4db899b8214309a6c429ba22ff7ac222...
        '401':
          description: Invalid email or password credentials

  /auth/refresh:
    post:
      summary: Rotate access sessions
      description: Uses a refresh token to generate a new short-lived access token and a rotated refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 8f4db899b8214309a6c429ba22ff7ac222...
      responses:
        '200':
          description: Access session renewed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Access session renewed successfully
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      refreshToken:
                        type: string
                        example: 3bb0a4025f18c8942b10df2ab33a2d2105...
        '401':
          description: Invalid, expired, or already-revoked refresh token

  /auth/logout:
    post:
      summary: Terminate user session
      description: Logs out the user by revoking and deleting the provided refresh token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: 8f4db899b8214309a6c429ba22ff7ac222...
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Logged out successfully. Session invalidated.

  /users:
    post:
      summary: Provision a new tenant user (ADMIN only)
      description: Creates a user account directly linked to the ADMIN's organization. Restricted to ADMIN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
              properties:
                email:
                  type: string
                  format: email
                  example: employee@acme.com
                password:
                  type: string
                  minimum: 8
                  example: TempPassword123!
                role:
                  type: string
                  enum: [MANAGER, MEMBER]
                  example: MEMBER
      responses:
        '201':
          description: Tenant user provisioned successfully
        '400':
          description: Validation error or invalid provisioning role (e.g. trying to create an ADMIN)
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden (strictly restricted to ADMIN role)
        '409':
          description: Conflict (email already registered)

    get:
      summary: List all users in organization (ADMIN and MANAGER only)
      description: Returns a list of users belonging strictly to the authenticated user's organization.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Users list fetched successfully
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden (strictly restricted to ADMIN or MANAGER roles)

  /users/{id}:
    patch:
      summary: Partially update tenant user (ADMIN only)
      description: Change the role or isBlocked status of an employee user in the organization. Restricted to ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the user to update
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [MANAGER, MEMBER]
                  example: MANAGER
                isBlocked:
                  type: boolean
                  example: true
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Validation error or self-mutation attempt
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden
        '404':
          description: User not found in this organization (BOLA guard)

    delete:
      summary: Remove user from organization (ADMIN only)
      description: Deletes and removes an employee user from the organization. Restricted to ADMIN.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID of the user to delete
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted successfully
        '400':
          description: Self-deletion attempt
        '401':
          description: Missing or expired token
        '403':
          description: Forbidden
        '404':
          description: User not found in this organization (BOLA guard)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
