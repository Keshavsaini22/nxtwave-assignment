openapi: 3.0.3
info:
  title: Team Task Tracker API
  description: |
    Production-grade SDE-II REST API for a team-based task tracker.
    Features role-based access control (RBAC), multi-tenancy (organizations), 
    strict state transitions, JWT token rotation, caching, and robust error handling.
  version: 1.0.0
  contact:
    name: SDE-II Candidate
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
paths:
  /auth/register:
    post:
      summary: Register a new user
      description: Create a user and associate them with a new or existing organization.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - role
                - organizationName
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minimum: 8
                  example: securepassword123
                role:
                  type: string
                  enum: [ADMIN, MANAGER, MEMBER]
                  example: MEMBER
                organizationName:
                  type: string
                  example: Acme Corp
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error or User already exists

  /auth/login:
    post:
      summary: Authenticate a user
      description: Logs in a user, returns access and refresh tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: securepassword123
      responses:
        '200':
          description: Authentication successful
        '401':
          description: Invalid email or password

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
